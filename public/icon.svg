<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#07182e" />
      <stop offset="100%" stopColor="#0b2447" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a3e635" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Shape / Brand Monogram -->
  <g transform="translate(106, 86) scale(7.5)" filter="url(#glow)">
    <!-- Northern Fashions Ribbon 1 -->
    <path d="M 10 28 C 10 16 20 10 30 10 C 25 18 20 22 10 28 Z" fill="url(#greenGrad)" />
    <!-- Northern Fashions Ribbon 2 -->
    <path d="M 30 10 C 30 22 20 28 10 28 C 15 20 20 16 30 10 Z" fill="url(#blueGrad)" />
    <!-- Center Fiber Stripe -->
    <path d="M 15 24 C 20 19 25 15 27 13" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- QMS Badge Text -->
  <rect x="156" y="380" width="200" height="48" rx="24" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" />
  <text x="256" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">QMS • NFL</text>
</svg>
