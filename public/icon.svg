<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182e" />
      <stop offset="100%" stop-color="#0b2447" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#10b981" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e3a5f" stroke-width="4" />

  <!-- Northern Fashions Ribbon Emblem -->
  <g transform="translate(86, 56) scale(8.5)" filter="url(#glow)">
    <path d="M 10 28 C 10 16 20 10 30 10 C 25 18 20 22 10 28 Z" fill="url(#greenGrad)" />
    <path d="M 30 10 C 30 22 20 28 10 28 C 15 20 20 16 30 10 Z" fill="url(#blueGrad)" />
    <path d="M 15 24 C 20 19 25 15 27 13" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- OQL Badge Text -->
  <rect x="116" y="362" width="280" height="82" rx="18" fill="#061428" stroke="#0284c7" stroke-width="5" />
  <text x="256" y="421" font-family="Noto Sans, Liberation Sans, DejaVu Sans, system-ui, sans-serif" font-size="54" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="8">OQL</text>
</svg>
